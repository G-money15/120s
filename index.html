<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>120s Card Game Score Keeper</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            text-align: center;

            margin-top: 50px;

            background-color: #f0f0f0;

        }

        .container {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            display: inline-block;

        }

        .team {

            margin: 20px;

        }

        .winner {

            color: green;

            font-size: 2em;

        }

        .buttons {

            margin: 10px;

        }

        .positive-message {

            font-size: 1.5em;

            color: blue;

        }

        .motivational-message {

            font-size: 1.2em;

            color: darkorange;

            margin-top: 20px;

        }

        .score-history {

            margin-top: 20px;

            text-align: center;

        }

        .score-table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

        }

        .score-table th, .score-table td {

            border: 1px solid #ddd;

            padding: 8px;

        }

        .score-table th {

            background-color: #f2f2f2;

        }

        .total-score {

            font-size: 1.5em;

            font-weight: bold;

        }

    </style>

</head>

<body>

 

    <div class="container">

        <h1>120s</h1>

 

        <div>

            <label for="team1-name">Enter Team 1 Name: </label>

            <input type="text" id="team1-name" placeholder="Team 1">

            <label for="team2-name">Enter Team 2 Name: </label>

            <input type="text" id="team2-name" placeholder="Team 2">

            <button onclick="startGame()">Start Game</button>

        </div>

 

        <div id="scoreboard" style="display:none;">

            <div class="team" id="team1">

                <h2 id="team1-label">Team 1</h2>

                <p class="total-score">Score: <span id="score1">0</span></p>

            </div>

 

            <div class="team" id="team2">

                <h2 id="team2-label">Team 2</h2>

                <p class="total-score">Score: <span id="score2">0</span></p>

            </div>

 

            <div class="buttons">

                <input type="number" id="team1-points" placeholder="Enter Team 1 points">

                <input type="number" id="team2-points" placeholder="Enter Team 2 points">

                <button onclick="addScores()">Add Points</button>

                <button onclick="undoLastRound()">Undo Last Round</button>

            </div>

 

            <div id="round-indicator">Round: <span id="round-number">1</span></div>

            <div class="score-history">

                <table class="score-table">

                    <thead>

                        <tr>

                            <th>Round</th>

                            <th>Team 1</th>

                            <th>Team 2</th>

                        </tr>

                    </thead>

                    <tbody id="score-history-body">

                    </tbody>

                </table>

            </div>

            <div id="winner" class="winner"></div>

            <div id="positive-message" class="positive-message"></div>

            <div id="motivational-message" class="motivational-message"></div>

            <button onclick="resetGame()">Reset Game</button>

        </div>

    </div>

 

    <script>

        let team1Score = 0;

        let team2Score = 0;

        let team1Name = "Team 1";

        let team2Name = "Team 2";

        let team1History = [];

        let team2History = [];

        let roundNumber = 1;

 

        const motivationalMessages = [

            "Yes by!",

            "What Odds?",

            "Get on the GO.",

            "Knows you're not crooked.",

            "The secret of getting ahead is getting started.",

            "The more you know, the more you realize you know nothing.",

            "It does not do to dwell on dreams and forget to live.",

            "The best investment you can make is in yourself.",

            "You don’t have to be great to start, but you have to start to be great.",

            "Keep pushing forward!",

            "Success is the sum of small efforts repeated day in and day out."

        ];

 

        function startGame() {

            const inputTeam1 = document.getElementById('team1-name').value;

            const inputTeam2 = document.getElementById('team2-name').value;

 

            if (inputTeam1) team1Name = inputTeam1;

            if (inputTeam2) team2Name = inputTeam2;

 

            document.getElementById('team1-label').textContent = team1Name;

            document.getElementById('team2-label').textContent = team2Name;

 

            document.getElementById('scoreboard').style.display = 'block';

        }

 

        function addScores() {

            const team1Points = parseInt(document.getElementById('team1-points').value);

            const team2Points = parseInt(document.getElementById('team2-points').value);

 

            team1Score += team1Points;

            team2Score += team2Points;

 

            document.getElementById('score1').textContent = team1Score;

            document.getElementById('score2').textContent = team2Score;

 

            team1History.push(team1Points);

            team2History.push(team2Points);

 

            updateHistory();

 

            roundNumber++;

            document.getElementById('round-number').textContent = roundNumber;

 

            checkWinner();

            showPositiveMessage(team1Points, team1Name);

            showPositiveMessage(team2Points, team2Name);

            showMotivationalMessage();

        }

 

        function undoLastRound() {

            if (roundNumber > 1) {

                team1Score -= team1History.pop();

                team2Score -= team2History.pop();

 

                document.getElementById('score1').textContent = team1Score;

                document.getElementById('score2').textContent = team2Score;

 

                updateHistory();

 

                roundNumber--;

                document.getElementById('round-number').textContent = roundNumber;

 

                document.getElementById('winner').textContent = '';

                enableButtons();

            }

        }

 

        function updateHistory() {

            const historyBody = document.getElementById('score-history-body');

            historyBody.innerHTML = '';

            for (let i = 0; i < team1History.length; i++) {

                const row = document.createElement('tr');

                const roundCell = document.createElement('td');

                const team1Cell = document.createElement('td');

                const team2Cell = document.createElement('td');

 

                roundCell.textContent = i + 1;

                team1Cell.textContent = team1History[i];

                team2Cell.textContent = team2History[i];

 

                row.appendChild(roundCell);

                row.appendChild(team1Cell);

                row.appendChild(team2Cell);

 

                historyBody.appendChild(row);

            }

        }

 

        function checkWinner() {

            if (team1Score >= 120) {

                document.getElementById('winner').textContent = `${team1Name} Wins!`;

                disableButtons();

            } else if (team2Score >= 120) {

                document.getElementById('winner').textContent = `${team2Name} Wins!`;

                disableButtons();

            }

        }

 

        function disableButtons() {

            const buttons = document.querySelectorAll('button');

            buttons.forEach(button => button.disabled = true);

            document.querySelector('button[onclick="resetGame()"]').disabled = false;

        }

 

        function enableButtons() {

            const buttons = document.querySelectorAll('button');

            buttons.forEach(button => button.disabled = false);

        }

 

        function showPositiveMessage(points, teamName) {

            const messageBox = document.getElementById('positive-message');

            if (points >= 30) {

                messageBox.textContent = `Way to go ${teamName}!`;

            } else {

                messageBox.textContent = '';

            }

        }

 

        function showMotivationalMessage() {

            const randomChance = Math.random();

            if (randomChance < 0.15) {  // 15% chance

                const randomIndex = Math.floor(Math.random() * motivationalMessages.length);

                const randomMessage = motivationalMessages[randomIndex];

                document.getElementById('motivational-message').textContent = randomMessage;

            } else {

                document.getElementById('motivational-message').textContent = '';

            }
